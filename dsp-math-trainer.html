<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DSP Math Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dsp-math-trainer.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e16">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<div id="app" class="app"></div>

<script src="dsp-math-trainer.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(() => {
        console.log("DSP Math Trainer — Service Worker actif");
      })
      .catch(error => {
        console.error("Erreur Service Worker :", error);
      });
  });
}
</script>

</body>
</html>
